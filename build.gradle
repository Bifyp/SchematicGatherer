plugins {
    id 'java'
    // Версия loom, которой собирается carpet под 26.x. Если не резолвится —
    // возьми актуальную с https://fabricmc.net/develop/template/
    id 'fabric-loom' version '1.17-SNAPSHOT'
}

base {
    archivesName = project.archives_base_name
}
version = project.mod_version
group = project.maven_group

// Baritone нужен ТОЛЬКО клиентской части (#gather). Если jar не положили в libs/ —
// собираем серверную часть (/gatherbot), иначе javac падает на baritone.api.*
def baritoneJar = file("libs/baritone-fabric.jar")
def baritonePresent = baritoneJar.exists()
if (!baritonePresent) {
    logger.lifecycle("[schematic-gatherer] libs/baritone-fabric.jar не найден -> собираю только серверную часть (/gatherbot), команда #gather выключена")
}

loom {
    // С 26.1 Minecraft больше не обфусцирован:
    //  - official mojang mappings не существуют (client_mappings нет в манифесте версии),
    //  - yarn для 26.x не выпускается (последний — 1.21.11),
    //  - intermediary 26.1 лежит с битой метадатой (bad version: found='0.0.0').
    // Поэтому работаем прямо на официальных именах классов (без промежуточных маппингов).
    noIntermediateMappings()
    productionNamespace = "official"
}

sourceSets {
    main {
        java {
            if (!baritonePresent) {
                exclude "dev/bifyp/schematicgatherer/SchematicGathererMod.java"
                exclude "dev/bifyp/schematicgatherer/GatherCommand.java"
                exclude "dev/bifyp/schematicgatherer/GatherProcess.java"
                exclude "dev/bifyp/schematicgatherer/MaterialCounter.java"
            }
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // Полностью пустой layered падает (srcNamespace = null), поэтому даём минимальный
    // tiny-файл official -> named без реальных переименований (identity).
    mappings loom.layered {
        it.mappings file("mappings/26.1-identity.tiny")
    }

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    // '+' = последняя Fabric API; при проблемах зафиксируй конкретную версию в gradle.properties
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Baritone API (только для клиентской команды #gather):
    // положи jar в libs/baritone-fabric.jar (см. README)
    compileOnly files("libs/baritone-fabric.jar")
}

processResources {
    inputs.property "version", project.version
    inputs.property "baritone", baritonePresent
    filesMatching("fabric.mod.json") {
        // без Baritone клиентский entrypoint не существует — подставляем пустой список
        expand "version": project.version,
                "client_entry": baritonePresent ? '"dev.bifyp.schematicgatherer.SchematicGathererMod"' : ''
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
}
